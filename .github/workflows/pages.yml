# Publishes the browser practice page (docs/) to GitHub Pages and rebuilds the
# list of demo recordings, so a demo folder uploaded through the GitHub website
# shows up on the page without running anything locally.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Publish practice page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the demo list
        run: python -m fsm.demo_index
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
